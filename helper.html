<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#F7E9E4"/>
<title>Ghar Kaam</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="firebase-config.js"></script>
<style>
:root{
  --bg: #FBF6F1;
  --surface: #FFFFFF;
  --surface-soft: #F7EDE5;
  --blush: #F0D9CE;
  --blush-deep: #D89B87;
  --sage: #A8B89F;
  --sage-deep: #7B9078;
  --sage-soft: #E4EBDF;
  --ink: #2A2320;
  --ink-soft: #6B5D57;
  --ink-mute: #A69990;
  --border: #EDDFD4;
  --gold: #B8926A;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter','Noto Sans Devanagari',system-ui,sans-serif;background:var(--bg);min-height:100dvh;display:flex;flex-direction:column;align-items:center;color:var(--ink);letter-spacing:-.005em}
.app{width:100%;max-width:440px;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column}

/* SETUP */
.setup{background:linear-gradient(160deg,#E4EBDF 0%,#CFD9C7 100%);flex:1;padding:64px 32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;min-height:100dvh}
.setup-logo{font-family:'Fraunces',serif;font-size:38px;font-weight:500;color:var(--ink);text-align:center;letter-spacing:-.02em;line-height:1.1}
.setup-sub{font-size:15px;color:var(--ink-soft);margin-top:10px;text-align:center;line-height:1.5;font-family:'Fraunces','Noto Sans Devanagari',serif;font-style:italic}
.setup-inp{width:100%;padding:22px;border:1px solid var(--border);border-radius:16px;font-size:20px;background:var(--surface);color:var(--ink);outline:none;text-align:center;letter-spacing:2px;font-weight:500;font-family:inherit;transition:.2s}
.setup-inp:focus{border-color:var(--sage-deep);box-shadow:0 0 0 3px rgba(123,144,120,.15)}
.setup-btn{width:100%;padding:20px;background:var(--ink);border:none;border-radius:16px;font-size:16px;font-weight:500;color:#fff;cursor:pointer;font-family:inherit;letter-spacing:.02em;transition:.2s}
.setup-btn:active{transform:scale(.98)}

/* HEADER */
.helper-hdr{background:linear-gradient(160deg,var(--sage-soft) 0%,#EEF3EA 100%);padding:28px 20px 22px;text-align:center;flex-shrink:0;position:relative;border-bottom:1px solid var(--border);margin:16px 18px 0;border-radius:20px 20px 0 0}
.hdr-code{position:absolute;top:10px;right:14px;font-size:10px;color:var(--ink-mute);padding:3px 10px;border-radius:8px;letter-spacing:.05em;font-weight:500}
.hdr-icon{display:none}
.hdr-title{font-family:'Fraunces','Noto Sans Devanagari',serif;font-size:26px;font-weight:500;color:var(--ink);letter-spacing:-.01em;line-height:1.2}
.hdr-sub{font-size:12px;color:var(--ink-soft);margin-top:6px;font-family:'Fraunces','Noto Sans Devanagari',serif;font-style:italic}

.notif-bar{background:var(--blush);padding:12px 16px;text-align:center;font-size:12px;color:var(--ink);border-bottom:1px solid var(--border);font-family:'Fraunces','Noto Sans Devanagari',serif;font-style:italic;margin:0 18px}
.notif-bar button{background:var(--ink);color:#fff;border:none;padding:7px 16px;border-radius:20px;font-size:11px;font-weight:500;margin-left:8px;cursor:pointer;font-family:'Inter',sans-serif;font-style:normal;letter-spacing:.02em}

/* DAY BAR */
.day-bar{background:var(--surface);padding:12px 16px;display:flex;gap:8px;overflow-x:auto;flex-shrink:0;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--border);margin:0 18px;border-radius:0 0 20px 20px}
.day-bar::-webkit-scrollbar{display:none}
.day-btn{padding:8px 16px;border-radius:20px;border:1px solid var(--border);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;background:transparent;color:var(--ink-soft);flex-shrink:0;font-family:inherit;transition:.2s;letter-spacing:.02em}
.day-btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* PROGRESS */
.h-prog{padding:14px 20px 6px;font-size:12px;color:var(--ink-soft);text-align:center;font-weight:500;font-family:'Fraunces','Noto Sans Devanagari',serif;font-style:italic;letter-spacing:.02em}
.h-prog-bar{margin:8px 20px 16px;background:var(--border);border-radius:20px;height:6px;overflow:hidden}
.h-prog-fill{height:100%;background:var(--sage-deep);border-radius:20px;transition:width .4s}

/* BODY */
.body{padding:0 18px 24px;flex:1;overflow-y:auto;position:relative}

.section-hdr{font-family:'Fraunces','Noto Sans Devanagari',serif;font-size:13px;font-weight:500;color:var(--ink-soft);letter-spacing:.05em;padding:16px 4px 10px;display:flex;align-items:center;gap:6px;font-style:italic}
.section-hdr:first-child{padding-top:8px}
.section-count{background:var(--blush);color:var(--ink-soft);font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500;font-family:'Inter',sans-serif;font-style:normal;letter-spacing:.02em}

/* TASK CARDS */
.task-card{border-radius:18px;margin-bottom:10px;overflow:hidden;border:1px solid var(--border);display:flex;align-items:stretch;background:var(--surface);transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.02)}
.task-card.done{border-color:var(--sage);background:var(--sage-soft)}
.task-card.speaking{border-color:var(--blush-deep);box-shadow:0 4px 16px rgba(216,155,135,.2)}
.task-card.weekly{border:1.5px solid var(--blush-deep);background:linear-gradient(135deg,#FBF3ED 0%,#F5E4D5 100%)}
.task-card.monthly{border:1.5px solid #B695C4;background:linear-gradient(135deg,#F5EEFA 0%,#EEE4F0 100%)}
.task-card.timed{border-left:4px solid var(--blush-deep)}
.task-card.done.weekly,.task-card.done.monthly{background:var(--sage-soft);border-color:var(--sage)}

.badge{display:inline-block;color:#fff;font-size:10px;font-weight:500;padding:3px 10px;border-radius:10px;margin-bottom:8px;letter-spacing:.03em;font-family:'Inter',sans-serif}
.badge-w{background:var(--blush-deep)}
.badge-m{background:#8A6E9E}
.task-card.done .badge{background:var(--sage-deep)}

.play-btn{width:64px;background:var(--blush);border:none;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink);transition:.2s}
.task-card.done .play-btn{background:var(--sage)}
.task-card.weekly .play-btn{background:var(--blush-deep);color:#fff}
.task-card.monthly .play-btn{background:#B695C4;color:#fff}
.task-card.done.weekly .play-btn,.task-card.done.monthly .play-btn{background:var(--sage);color:var(--ink)}
.task-card.speaking .play-btn{animation:pulse .8s infinite alternate}
@keyframes pulse{from{opacity:1}to{opacity:.5}}

.task-info{flex:1;padding:14px 14px}
.ttime{font-size:11px;color:var(--blush-deep);font-weight:600;margin-bottom:5px;letter-spacing:.03em;font-family:'Inter',sans-serif}
.tname{font-size:15px;font-weight:500;color:var(--ink);line-height:1.4;letter-spacing:-.005em}
.task-card.done .tname{color:var(--sage-deep)}
.tmeta{font-size:11px;color:var(--sage-deep);margin-top:5px;font-weight:500;font-family:'Fraunces','Noto Sans Devanagari',serif;font-style:italic}
.check-btn{width:56px;border:none;background:transparent;cursor:pointer;font-size:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.check-btn:active{transform:scale(.85)}

/* RESET */
.reset-bar{padding:12px 16px 24px;text-align:center}
.reset-btn{background:transparent;border:1px solid var(--border);border-radius:20px;padding:9px 20px;font-size:12px;color:var(--ink-mute);cursor:pointer;font-family:'Fraunces','Noto Sans Devanagari',serif;font-style:italic}

.empty{text-align:center;padding:80px 20px;color:var(--ink-mute);font-size:14px;font-family:'Fraunces','Noto Sans Devanagari',serif;font-style:italic;line-height:1.8}
</style>
</head>
<body>
<div class="app">

<div id="setup" class="setup">
  <div>
    <div class="setup-logo">Ghar Kaam</div>
    <div class="setup-sub" id="setup-sub">Enter the code from<br/>your employer</div>
  </div>
  <div style="width:100%">
    <input class="setup-inp" id="code-inp" placeholder="CODE" maxlength="15" />
  </div>
  <button class="setup-btn" id="start-btn" onclick="setupCode()">Start →</button>
</div>

<div id="main" style="display:none;flex-direction:column;flex:1">

  <div class="helper-hdr">
    <span class="hdr-code" id="hdr-code"></span>
    <div class="hdr-title" id="h-greeting">Today's Tasks</div>
    <div class="hdr-sub" id="h-subtext">Tap ▶ to hear</div>
  </div>

  <div id="notif-bar" class="notif-bar" style="display:none">
    🔔 <span id="notif-text">Get reminded 5 min before each task</span>
    <button onclick="enableNotifs()">Enable</button>
  </div>

  <div class="day-bar" id="day-bar"></div>
  <div class="h-prog" id="h-prog-lbl"></div>
  <div class="h-prog-bar"><div class="h-prog-fill" id="h-prog-fill" style="width:0%"></div></div>

  <div class="body" id="helper-body"></div>

  <div class="reset-bar">
    <button class="reset-btn" id="reset-btn" onclick="resetDone()">↺ Reset for new day</button>
  </div>
</div>

</div>

<script>
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WEEKDAY_KEYS = {Sun:'Sun',Mon:'Mon',Tue:'Tue',Wed:'Wed',Thu:'Thu',Fri:'Fri',Sat:'Sat'};

// UI translations per language
const UI_STRINGS = {
  'en-IN': {
    greeting_morning: 'Good morning! 🌞',
    greeting_afternoon: 'Namaste! ☀️',
    greeting_evening: 'Good evening! 🌆',
    subtext: 'Tap ▶ to hear',
    setup_sub: 'Enter the code<br/>your employer gave you',
    start: 'Start →',
    special: '⭐ Special tasks today',
    laundry: '🧺 Today\'s laundry',
    timed: '⏰ Fixed time tasks',
    anytime: '📋 Do anytime today',
    done_label: '✓ Done',
    once_weekly: '⭐ Once a week',
    once_monthly: '🌟 Once a month',
    empty: 'No tasks today',
    progress: 'done',
    reset_confirm: 'Reset all tasks?',
    notif_text: 'Get reminded 5 min before each task',
    reset_btn: '↺ Reset for new day'
  },
  'hi-IN': {
    greeting_morning: 'सुप्रभात! 🌞',
    greeting_afternoon: 'नमस्ते! ☀️',
    greeting_evening: 'शाम को नमस्ते! 🌆',
    subtext: 'सुनने के लिए ▶ दबाएँ',
    setup_sub: 'आपका काम देखने के लिए<br/>कोड डालिए',
    start: 'शुरू करें →',
    special: '⭐ आज के खास काम',
    laundry: '🧺 आज की धुलाई',
    timed: '⏰ समय पर करने वाले काम',
    anytime: '📋 कभी भी करें',
    done_label: '✓ हो गया',
    once_weekly: '⭐ हफ्ते में एक बार',
    once_monthly: '🌟 महीने में एक बार',
    empty: 'आज कोई काम नहीं है',
    progress: 'काम हुए',
    reset_confirm: 'सभी काम रीसेट करें?',
    notif_text: 'काम के 5 मिनट पहले सूचना पाएँ',
    reset_btn: '↺ नए दिन के लिए रीसेट करें'
  }
};

function T(key) {
  const strs = UI_STRINGS[language] || UI_STRINGS['en-IN'];
  return strs[key] || UI_STRINGS['en-IN'][key] || key;
}

let homeCode = null;
let tasks = [];
let weekly = {};
let monthly = [];
let laundry = {};
let language = 'en-IN';
let doneMap = {};
let selectedDay = null;
let speakingId = null;
let unsubTasks = null, unsubDone = null, unsubConfig = null;

function initApp() {
  homeCode = localStorage.getItem('gk_home_code');
  if (homeCode) showMain();
  else showSetup();
}

function showSetup() {
  document.getElementById('setup').style.display = 'flex';
  document.getElementById('main').style.display = 'none';
}

function setupCode() {
  const code = document.getElementById('code-inp').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'');
  if (!code || code.length < 3) { alert('Enter valid code (min 3 characters)'); return; }
  homeCode = code;
  localStorage.setItem('gk_home_code', homeCode);
  showMain();
}

function showMain() {
  document.getElementById('setup').style.display = 'none';
  document.getElementById('main').style.display = 'flex';
  document.getElementById('hdr-code').textContent = '🔑 ' + homeCode;
  initGreeting();
  subscribeAll();
  checkNotifPermission();
}

function initGreeting() {
  const now = new Date();
  selectedDay = DAYS[now.getDay()];
  const h = now.getHours();
  const greetKey = h < 12 ? 'greeting_morning' : h < 17 ? 'greeting_afternoon' : 'greeting_evening';
  document.getElementById('h-greeting').textContent = T(greetKey);
  document.getElementById('h-subtext').textContent = T('subtext');
  document.getElementById('day-bar').innerHTML = DAYS.map(d =>
    '<button class="day-btn' + (d === selectedDay ? ' on' : '') + '" onclick="selectDay(\'' + d + '\')">' + d + '</button>'
  ).join('');
  document.getElementById('reset-btn').textContent = T('reset_btn');
  document.getElementById('notif-text').textContent = T('notif_text');
}

function selectDay(d) {
  selectedDay = d;
  document.querySelectorAll('.day-btn').forEach(b => b.classList.toggle('on', b.textContent === d));
  render();
}

function subscribeAll() {
  if (unsubTasks) unsubTasks();
  if (unsubDone) unsubDone();
  if (unsubConfig) unsubConfig();

  unsubTasks = db.collection('homes').doc(homeCode).collection('tasks')
    .orderBy('order').onSnapshot(snap => {
      tasks = snap.docs.map(d => ({id: d.id, ...d.data()}));
      render();
      scheduleNotifications();
    });

  const today = new Date().toISOString().slice(0, 10);
  unsubDone = db.collection('homes').doc(homeCode).collection('done').doc(today)
    .onSnapshot(doc => {
      doneMap = (doc.exists ? doc.data() : {}) || {};
      render();
    });

  unsubConfig = db.collection('homes').doc(homeCode).onSnapshot(doc => {
    if (doc.exists) {
      const d = doc.data();
      weekly = d.weekly || {};
      monthly = d.monthly || [];
      laundry = d.laundry || {};
      // Only support English or Hindi — fallback anything else to English
      const savedLang = d.language || 'en-IN';
      language = (savedLang === 'hi-IN') ? 'hi-IN' : 'en-IN';
      initGreeting();
      render();
      scheduleNotifications();
    }
  });
}

function getSatWeekOfMonth() {
  return Math.ceil(new Date().getDate() / 7);
}

function getTasksForDay(day) {
  return tasks.filter(t => {
    if (!t.enabled) return false;
    if (t.freq === 'daily') return true;
    if (t.freq === 'weekly') return (t.days || []).includes(day);
    if (t.freq === 'monthly') {
      // Show on the 1st Saturday of month by default (or 1st day of month if not Sat)
      return day === 'Sat';
    }
    if (t.freq === 'once') {
      if (!t.createdAt) return true;
      const c = t.createdAt.toDate ? t.createdAt.toDate() : new Date(t.createdAt);
      const now = new Date();
      return c.toDateString() === now.toDateString() && day === DAYS[now.getDay()];
    }
    return false;
  });
}

function getWeeklyForDay(day) {
  if (weekly[day]) return {id:'w-'+day, text: weekly[day], kind:'weekly'};
  return null;
}

function getMonthlyForToday() {
  if (selectedDay !== 'Sat') return null;
  if (!monthly.length) return null;
  const idx = (getSatWeekOfMonth() - 1) % monthly.length;
  return {id:'m-'+idx, text: monthly[idx], kind:'monthly'};
}

function render() {
  const dayTasks = getTasksForDay(selectedDay);
  const timed = dayTasks.filter(t => t.time).sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));
  const anytime = dayTasks.filter(t => !t.time);
  const wk = getWeeklyForDay(selectedDay);
  const mo = getMonthlyForToday();
  const laundryToday = laundry[selectedDay];

  // Progress
  const allForProgress = [...timed, ...anytime];
  if (wk) allForProgress.push({id: wk.id});
  if (mo) allForProgress.push({id: mo.id});
  if (laundryToday) allForProgress.push({id: 'laundry-' + selectedDay});
  const total = allForProgress.length;
  const doneC = allForProgress.filter(t => doneMap[t.id]).length;
  const pct = total ? Math.round(doneC / total * 100) : 0;
  document.getElementById('h-prog-lbl').textContent = doneC + ' / ' + total + ' ' + T('progress') + ' (' + pct + '%)';
  document.getElementById('h-prog-fill').style.width = pct + '%';

  let html = '';

  if (wk || mo) {
    html += '<div class="section-hdr">' + T('special') + '</div>';
    if (mo) html += renderTask(mo);
    if (wk) html += renderTask(wk);
  }

  if (laundryToday) {
    html += '<div class="section-hdr">' + T('laundry') + '</div>';
    html += renderTask({id: 'laundry-' + selectedDay, text: laundryToday, kind: 'weekly'});
  }

  if (timed.length) {
    html += '<div class="section-hdr">' + T('timed') + ' <span class="section-count">' + timed.length + '</span></div>';
    html += timed.map(t => renderTask({id: t.id, text: t.name, time: t.time, kind: 'timed'})).join('');
  }

  if (anytime.length) {
    html += '<div class="section-hdr">' + T('anytime') + ' <span class="section-count">' + anytime.length + '</span></div>';
    html += anytime.map(t => renderTask({id: t.id, text: t.name})).join('');
  }

  if (!timed.length && !anytime.length && !wk && !mo && !laundryToday) {
    html = '<div class="empty">' + T('empty') + '</div>';
  }

  document.getElementById('helper-body').innerHTML = html;
}

function renderTask(t) {
  const isDone = doneMap[t.id];
  const isSpeaking = speakingId === t.id;
  const kind = t.kind || '';
  const classes = 'task-card' + (isDone ? ' done' : '') + (isSpeaking ? ' speaking' : '') + (kind ? ' ' + kind : '');
  let badge = '';
  if (kind === 'weekly')  badge = '<div class="badge badge-w">' + T('once_weekly') + '</div>';
  if (kind === 'monthly') badge = '<div class="badge badge-m">' + T('once_monthly') + '</div>';

  return '<div class="' + classes + '">' +
    '<button class="play-btn" onclick="speakTask(\'' + t.id + '\')">' + (isSpeaking ? '🔊' : '▶') + '</button>' +
    '<div class="task-info">' +
    (t.time ? '<div class="ttime">⏰ ' + formatTime12(t.time) + (t.timeEnd ? ' – ' + formatTime12(t.timeEnd) : '') + '</div>' : '') +
    badge +
    '<div class="tname">' + escapeHtml(t.text) + '</div>' +
    (isDone ? '<div class="tmeta">' + T('done_label') + '</div>' : '') +
    '</div>' +
    '<button class="check-btn" onclick="toggleDone(\'' + t.id + '\')">' + (isDone ? '✅' : '⭕') + '</button>' +
    '</div>';
}

function speakTask(id) {
  if (!window.speechSynthesis) return;
  let text = null;
  const t = tasks.find(x => x.id === id);
  if (t) text = t.name;
  else if (id.startsWith('w-')) text = weekly[id.slice(2)];
  else if (id.startsWith('m-')) text = monthly[parseInt(id.slice(2))];
  else if (id.startsWith('laundry-')) text = laundry[id.slice(8)];
  if (!text) return;

  window.speechSynthesis.cancel();
  speakingId = id;
  render();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = language;
  u.rate = 0.85;
  const voices = window.speechSynthesis.getVoices();
  const v = voices.find(x => x.lang === language) || voices.find(x => x.lang.startsWith(language.split('-')[0]));
  if (v) u.voice = v;
  u.onend = u.onerror = () => { speakingId = null; render(); };
  window.speechSynthesis.speak(u);
}

if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

async function toggleDone(id) {
  doneMap[id] = !doneMap[id];
  if (!doneMap[id]) delete doneMap[id];
  render();
  if (doneMap[id]) confetti();
  const today = new Date().toISOString().slice(0, 10);
  try {
    await db.collection('homes').doc(homeCode).collection('done').doc(today).set(doneMap, {merge: false});
  } catch (e) { console.error(e); }
}

async function resetDone() {
  if (!confirm(T('reset_confirm'))) return;
  doneMap = {}; render();
  const today = new Date().toISOString().slice(0, 10);
  try { await db.collection('homes').doc(homeCode).collection('done').doc(today).set({}); } catch(e) {}
}

function confetti() {
  const b = document.getElementById('helper-body');
  const d = document.createElement('div');
  d.style.cssText = 'position:absolute;top:0;left:0;right:0;pointer-events:none;height:80px;overflow:hidden;z-index:10';
  const colors = ['#E8943A','#3D7A4A','#4A6FA5','#C0622A','#FFD700'];
  for (let i = 0; i < 22; i++) {
    const s = document.createElement('div');
    const sz = 7 + Math.random() * 7;
    s.style.cssText = 'position:absolute;width:'+sz+'px;height:'+sz+'px;background:'+colors[Math.floor(Math.random()*colors.length)]+';border-radius:'+(Math.random()>.5?'50%':'3px')+';left:'+(5+Math.random()*90)+'%;top:-12px;animation:fall 1.3s ease-in forwards;animation-delay:'+(Math.random()*.35)+'s';
    d.appendChild(s);
  }
  b.appendChild(d);
  setTimeout(() => { try { b.removeChild(d); } catch(e) {} }, 1800);
}

function checkNotifPermission() {
  if (!('Notification' in window) || !('serviceWorker' in navigator)) return;
  if (Notification.permission === 'default') {
    document.getElementById('notif-bar').style.display = 'block';
  } else if (Notification.permission === 'granted') {
    registerSW();
  }
}

async function enableNotifs() {
  const perm = await Notification.requestPermission();
  if (perm === 'granted') {
    document.getElementById('notif-bar').style.display = 'none';
    registerSW();
  }
}

async function registerSW() {
  try {
    await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    scheduleNotifications();
  } catch(e) { console.error(e); }
}

function scheduleNotifications() {
  if (Notification.permission !== 'granted' || !navigator.serviceWorker.controller) return;
  const today = DAYS[new Date().getDay()];
  const dayTasks = getTasksForDay(today);
  const timedTasks = dayTasks.filter(t => t.time).map(t => ({
    id: t.id, name: t.name, time: t.time
  }));

  const morningTasks = [];
  const wk = getWeeklyForDay(today);
  if (wk) morningTasks.push({id: wk.id, name: wk.text});
  if (today === 'Sat') {
    const mo = getMonthlyForToday();
    if (mo) morningTasks.push({id: mo.id, name: mo.text});
  }
  if (laundry[today]) morningTasks.push({id: 'laundry-' + today, name: laundry[today]});

  navigator.serviceWorker.controller.postMessage({
    type: 'SCHEDULE',
    timedTasks,
    morningTasks
  });
}

function timeToMinutes(t) {
  if (!t) return 0;
  const parts = t.split(':');
  return parseInt(parts[0]) * 60 + (parseInt(parts[1]) || 0);
}

function formatTime12(t) {
  if (!t) return '';
  const parts = t.split(':');
  let h = parseInt(parts[0]);
  const m = parts[1] || '00';
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12;
  if (h === 0) h = 12;
  return h + ':' + m + ' ' + ampm;
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

initApp();
</script>
